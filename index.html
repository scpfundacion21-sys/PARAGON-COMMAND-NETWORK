<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PARAGON-STRIKE-DIVISION</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="boot-screen">

    <!-- LOGO REAL COMO FONDO -->
    <div class="background"></div>

    <!-- GRID -->
    <div class="grid"></div>

    <!-- SCANLINES -->
    <div class="scanlines"></div>

    <div class="boot-container">

      <div class="system-label">
        PARAGON // STRIKE DIVISION
      </div>

      <!-- EMBLEMA ORIGINAL DEL DISEÑO -->
      <div class="emblem">

        <div class="outer-ring">

          <div class="inner-ring">

            <div class="shield">
              P
            </div>

          </div>

        </div>

      </div>

      <div class="company-name">
        PARAGON
        <span>STRIKE DIVISION</span>
      </div>

      <div class="status">
        <span id="statusText">
          INITIALIZING SYSTEM
        </span>
      </div>

      <div class="progress-area">

        <div class="progress-info">

          <span>
            SYSTEM BOOT
          </span>

          <span id="percent">
            0%
          </span>

        </div>

        <div class="progress-bar">

          <div id="progress"></div>

        </div>

      </div>

      <button id="enterButton" disabled>
        ENTER SYSTEM
      </button>

      <div class="security">
        SECURE CONNECTION // AUTHORIZED PERSONNEL ONLY
      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
